<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12161c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reportistica">
<title>Reportistica FIL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: stile sito FIL — barra bianca con logo, schede bianche con bordo blu in alto, blu FIL per i tasti */
:root{
  --hero:#0b0f14; --hero-ink:#ffffff; --shadow:0 2px 14px rgba(0,0,0,.5);
  --bg:#12161c; --panel:#1b232c; --ink:#e8ecf0; --muted:#a3adb8; --line:#3a4756;
  --steel:#2884ff; --accent:#2884ff; --accent-ink:#ffffff; --ok:#4fbf82; --bad:#ef6f63; --soft:#0f1318; color-scheme:dark;
  --f-display:"Open Sans","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14.5px/1.4 var(--f-body);padding-inline:16px;padding-block:0 24px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:6px}

/* barra bianca come il sito */
header{display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:3px solid var(--accent);margin-inline:-16px;padding:5px 16px;box-shadow:var(--shadow)}
.logo{height:36px;min-width:38px;padding:0 6px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 17px/1 var(--f-display);letter-spacing:1px}
.logofull{height:36px;width:auto;display:block}
/* titolo nella barra, accanto al logo */
.htitle{display:flex;flex-direction:column;justify-content:center;min-width:0;border-left:1px solid var(--line);padding-left:12px;align-self:stretch}
.htitle h1{margin:0;font:400 18px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.5px;color:var(--ink)}
.htitle p{margin:1px 0 0;font:600 12.5px/1.2 var(--f-body);color:var(--accent)}
.card{background:var(--panel);border:0;border-top:3px solid var(--accent);border-radius:2px;box-shadow:var(--shadow);padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px}
h2{margin:0;font:400 15px/1.2 var(--f-display);text-transform:uppercase;color:var(--accent)}
textarea,input{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:2px;padding:6px 9px;width:100%;min-height:40px;font-size:15px;scroll-margin:80px 0 140px}
textarea{resize:vertical;min-height:40px;line-height:1.35;overflow-y:hidden}
textarea:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:600 14.5px/1.1 var(--f-body);border-radius:2px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.shiftRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shiftRow button{font-family:var(--f-mono);font-weight:500;padding:6px 2px}
.shiftRow button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--panel)}
.shiftRow input{grid-column:1/-1;font-family:var(--f-mono);min-width:0}

.group h3{margin:8px 0 0;font:400 15px/1.2 var(--f-display);text-transform:uppercase;color:var(--accent)}
.group ul{list-style:none;margin:0;padding:0}
.group li{border-top:1px solid var(--line);padding:5px 0;display:flex;flex-direction:column;gap:4px}
.frow{display:flex;align-items:center;gap:8px}
.frow .t{flex:1;min-width:0}
.frow .name{font-weight:600}
.tri{flex:0 0 34px;height:34px;min-height:34px;padding:0;font:700 15px/1 var(--f-body);border-radius:4px;background:var(--panel);color:var(--muted);border:2px solid var(--muted)}
.tri[data-st="off"]{background:var(--soft);border-color:var(--line);color:var(--bad)}
.group li.off .name,.group li.off .cur{opacity:.45;text-decoration:line-through}
input.cb{-webkit-appearance:none;appearance:none;flex:0 0 34px;width:34px;height:34px;min-height:34px;padding:0;margin:0;border:2px solid #44536a;border-radius:4px;background:linear-gradient(180deg,#2b3643,#1d2631);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 3px rgba(0,0,0,.55);cursor:pointer;display:grid;place-content:center}
input.cb:checked{background:linear-gradient(180deg,#4c9bff,#2884ff 45%,#1b6fe0);border-color:#1558b8}
input.cb:checked::after{content:"\2713";color:#fff;font:700 22px/1 var(--f-body)}
label.name{cursor:pointer}
.cassbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:6px}
.cassbar h4{margin:0;font:600 14.5px/1.2 var(--f-body)}
.cassbar button{padding:4px 12px;font-size:13px;min-height:36px}
.cassbox{border-top:1px solid var(--line);padding:5px 0;display:flex;flex-direction:column;gap:4px}
.seg.tipo button{padding:6px 2px;font-size:13.5px}
.seg.tipo{grid-template-columns:repeat(3,1fr);flex:1 1 200px}
.ck{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ck input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;padding:0;accent-color:var(--accent)}
.ck .t{display:flex;flex-direction:column;min-width:0}
.ck .name{font-weight:600}
.ck .cur{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck .cur.bad{color:var(--bad)}
.ed{padding-left:0;display:flex;flex-direction:column;gap:4px}
.fix{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fix .pre,.fix .suf{font-size:14px;line-height:1.2;color:var(--muted)}
.fix input{flex:1 1 120px;min-width:0}
.fix input.n{flex:0 1 110px;font-family:var(--f-mono);font-size:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.seg button{padding:6px 6px}
.seg.st{flex:1 1 160px;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-columns:none}
.cas{display:flex;flex-direction:column;gap:4px}
.cas .pre{min-width:72px}
.seg.nums button{font-family:var(--f-mono)}
.seg.st button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button.c[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.seg button.n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--panel)}

#out,#mg-out,#la-out{min-height:100px;max-height:170px;overflow-y:auto;font-size:14px}
.view{display:flex;flex-direction:column;gap:8px}
.backbtn{flex:0 0 40px;width:40px;height:40px;min-height:40px;padding:0;font-size:22px;line-height:1;border-radius:2px;background:var(--panel);color:var(--accent);border:1px solid var(--line)}
.htitle h1.long{font-size:15px}
body:not([data-view="turno"]) #heroSub{display:none}
.tiles{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.tile{width:100%;min-height:78px;flex-direction:column;gap:4px;font:600 20px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.5px;border-radius:2px;box-shadow:var(--shadow)}
.tile small{font:600 12px/1 var(--f-body);text-transform:none;letter-spacing:0}
.tile:disabled{background:var(--soft);color:var(--muted);border:1px dashed var(--line);box-shadow:none;cursor:not-allowed}
.fix.multi{align-items:center}
.fix.multi .pre{flex:0 0 92px}
.fix.multi input{flex:1 1 0;min-width:0;font-family:var(--f-mono);font-size:16px}
.fix.multi .pre.lbl{flex:0 0 auto}
.lotbar{display:flex;gap:8px;justify-content:space-between;align-items:center}
.lotbar h3{margin:8px 0 0}
.lotbar button{padding:4px 12px;font-size:13px;min-height:36px}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.bar{flex-wrap:nowrap}
.bar>*{flex:1 1 0;min-width:0}
.bar>button{flex:0 0 32%;font-size:13.5px}
.bar>.btn{flex:1 1 0;font-size:15.5px}
.status{font-size:13px;color:var(--ok);margin:0}
@media (prefers-reduced-motion:no-preference){button{transition:none}}

/* tasti bombati */
button,.btn{background:linear-gradient(180deg,#2b3643 0%,#1d2631 100%);border-color:#44536a;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 3px rgba(0,0,0,.55);transition:none}
button.primary,.tile:not(:disabled),.btn{background:linear-gradient(180deg,#4c9bff 0%,#2884ff 45%,#1b6fe0 100%);border-color:#1558b8;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 4px rgba(0,0,0,.6)}
.shiftRow button[aria-pressed="true"],.seg.st button[aria-pressed="true"]{background:linear-gradient(180deg,#4c9bff,#2884ff 45%,#1b6fe0);border-color:#1558b8;color:#fff}
.seg button.c[aria-pressed="true"]{background:linear-gradient(180deg,#6fd39d,#4fbf82 45%,#3a9f69);border-color:#2f8658;color:#08170f}
.seg button.n[aria-pressed="true"]{background:linear-gradient(180deg,#f58b81,#ef6f63 45%,#d4574b);border-color:#b04439;color:#1d0805}
button:active,.btn:active{transform:translateY(1px);filter:brightness(.9);box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
button:disabled,.tile:disabled{background:#161b21;color:#6d7783;border:1px dashed #333e4a;box-shadow:none;transform:none;filter:none}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <button class="backbtn" id="back" type="button" aria-label="Torna alla home" hidden>&larr;</button>
    <img class="logofull" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMDcgNDcyIj48cmVjdCB3aWR0aD0iMTQ3IiBoZWlnaHQ9IjQ3MiIgZmlsbD0iIzNhN2ZjMSIvPjxyZWN0IHg9IjE0NyIgd2lkdGg9IjE2MCIgaGVpZ2h0PSI0NzIiIGZpbGw9IiMxZDFkMWIiLz48ZyBmaWxsPSIjZmZmIj48cmVjdCB4PSI0NCIgeT0iNTQiIHdpZHRoPSIzMCIgaGVpZ2h0PSIzNzgiLz48cmVjdCB4PSI0NCIgeT0iNTQiIHdpZHRoPSI3OCIgaGVpZ2h0PSIyOCIvPjxyZWN0IHg9IjQ0IiB5PSIyMzAiIHdpZHRoPSI2NiIgaGVpZ2h0PSIyNyIvPjxyZWN0IHg9IjE0MiIgeT0iNTQiIHdpZHRoPSIyOCIgaGVpZ2h0PSIzNzgiLz48cmVjdCB4PSIyMDAiIHk9IjU0IiB3aWR0aD0iMjgiIGhlaWdodD0iMzc4Ii8+PHJlY3QgeD0iMjAwIiB5PSI0MDQiIHdpZHRoPSI2NyIgaGVpZ2h0PSIyOCIvPjwvZz48L3N2Zz4K" alt="FIL">
    <div class="htitle"><h1 id="hTitle">Reportistica</h1><p id="heroSub">&nbsp;</p></div>

  <div class="view" id="v-home">

<script>
/* ---------- i campi (le "celle") ---------- */
// pre/suf = testo fisso intorno al box; opt = se lo lasci vuoto la riga sparisce
const DIFF_PRE = 'Emissioni diffuse (discagliatore, spianatrice, taglio lamiere e treno di laminazione):';
const FIELDS = [
  { g:'Produzione', id:'prod',      name:'Produzione',            type:'num',  pre:'Produzione', suf:'ton' },
  { g:'Produzione', id:'ritardi',   name:'Ritardi',               type:'text', opt:true },
  { g:'Produzione', id:'copertura', name:'Copertura schede',      type:'time', pre:'Copertura schede fino alle', opt:true },
  { g:'Controllo magazzino', id:'pacchiMag',   name:'Pacchi in magazzino',          type:'num', re:/^pacchi\s+in\s+magazzino/i },
  { g:'Controllo magazzino', id:'pacchiSped',  name:'Pacchi spedibili',             type:'num', re:/^pacchi\s+spedibili/i },
  { g:'Controllo magazzino', id:'intest',      name:'Intestature a terra',          type:'num', re:/^intestature/i },
  { g:'Controllo magazzino', id:'montalbetti', name:'Cassone Montalbetti',          type:'cassoni', re:/montalbetti/i },
  { g:'Controllo magazzino', id:'risaliti',    name:'Cassone Risaliti',             type:'cassoni', re:/risaliti/i },
  { g:'Controllo magazzino', id:'scoriaM',     name:'Cassone scoria',               type:'cassoni', re:/scoria/i },
  { g:'Controllo magazzino', id:'bancali',     name:'Bancali talloni',              type:'numtext', re:/^bancali/i },
  { g:'Controllo magazzino', id:'talloni',     name:'Talloni da tagliare',          type:'num', re:/^talloni/i },
  { g:'Controllo magazzino', id:'bloccate',    name:'Lamiere bloccate nel pulpito', type:'num', re:/bloccate/i },
  { g:'Reparto taglio bramme', id:'taglio',    name:'Bramme tagliate',              type:'num', re:/^bramme\s+tagliate/i },
  { g:'Reparto taglio bramme', id:'scoriaB',   name:'Cassone scoria',               type:'cassoni', re:/scoria/i },
  { g:'Sicurezza',  id:'dpi',       name:'DPI e procedure',       type:'line' },
  { g:'Sicurezza',  id:'pulizia',   name:'Pulizia',               type:'line', pre:'Pulizia:' },
  { g:'Sicurezza',  id:'violenza',  name:'Violenza',              type:'line' },
  { g:'Sicurezza',  id:'nearmiss',  name:'Near miss',             type:'line' },
  { g:'Qualità',    id:'estetica',  name:'Estetica',              type:'conf' },
  { g:'Qualità',    id:'planarita', name:'Planarità',             type:'conf' },
  { g:'Qualità',    id:'dimensioni',name:'Larghezze, lunghezze e spessori', type:'conf', plural:true },
  { g:'Qualità',    id:'noteq',     name:'Note qualità',          type:'text', opt:true },
  { g:'Ambiente',   id:'scrubber',  name:'Scrubber',              type:'line', pre:'Scrubber' },
  { g:'Ambiente',   id:'convog',    name:'Emissioni convogliate', type:'line', pre:'Emissioni convogliate' },
  { g:'Ambiente',   id:'diffuse',   name:'Emissioni diffuse',     type:'line', pre:DIFF_PRE },
  { g:'Segnalazioni', id:'segn',    name:'Segnalazioni',          type:'text', opt:true },
];
const BYID = Object.fromEntries(FIELDS.map(f => [f.id, f]));
const COMPOSITE = t => t === 'numstate' || t === 'numtext';
const STATES = ['vuoto','metà','pieno'];
const DEFAULT = {
  prod:'', ritardi:'', copertura:'', taglio:'',
  pacchiMag:'', pacchiSped:'', intest:'', montalbetti:{n:'',s:[]}, risaliti:{n:'',s:[]}, scoriaM:{n:'',s:[]},
  bancali:{n:'',s:''}, talloni:'', bloccate:'', scoriaB:{n:'',s:[]},
  dpi:'Tutti i dipendenti hanno indossato correttamente i DPI e rispettato le procedure di sicurezza.',
  pulizia:'nessuna segnalazione.', violenza:'Nessun atto di violenza nè fisica nè verbale.', nearmiss:'Nessun near miss.',
  estetica:'c', planarita:'c', dimensioni:'c', noteq:'',
  scrubber:'in marcia.', convog:'nella norma', diffuse:'nella norma', segn:''
};

const $ = id => document.getElementById(id);
let gen = false;           // messaggio generato senza report incollato
let orig = {};            // campi letti dal report di prima
let checked = new Set();  // campi spuntati
let excluded = new Set(); // campi tolti dal messaggio (interruttore ✕)
const on = id => !excluded.has(id);
let values = {};          // valori scritti nei box

/* ---------- lettura del report ---------- */
const BUL = /^\s*[•\-*·]\s*/;
const SALUTO = /^(buon(giorno|asera|a\s+\w+|\s+\w+)|ciao|salve|ecco)\b[^\n]{0,40}$/i;
const SECT = /^\s*\*?\s*(controllo\s+magazzino|reparto\s+taglio\s+bramme|sicurezza|qualit[aà]|ambiente|segnalazioni)\s*\*?\s*:?\s*$/i;
function clean(t){
  return t.replace(/\r\n?/g,'\n').replace(/[‎‏‪-‮]/g,'')
    .replace(/^\s*\[\d{1,2}\/\d{1,2}(?:\/\d{2,4})?,?\s+\d{1,2}[:.]\d{2}\]\s*[^:\n]+:\s*/gm,'');
}
function readVal(fd, rest){
  rest = rest.trim().replace(/\.$/,'');
  if (fd.type === 'num') { const m = rest.match(/\d+(?:[.,]\d+)?/); return m ? m[0] : ''; }
  if (fd.type === 'cassoni') {
    const st = (rest.match(/pien\w*|met\w*|vuot\w*/gi) || []).map(k => /^pien/i.test(k) ? 'pieno' : /^met/i.test(k) ? 'metà' : 'vuoto');
    const n = (rest.match(/^\s*(\d+)/) || [])[1] || (st.length ? String(st.length) : '');
    return { n, s: st };
  }
  if (fd.type === 'state') { const m = rest.match(/pien|met|vuot/i); return m ? ({pien:'pieno', met:'metà', vuot:'vuoto'})[m[0].toLowerCase()] : ''; }
  const m = rest.match(/^\s*(?:n°?\s*)?(\d+)?\s*[,;-]?\s*(.*)$/i);
  let st = (m[2] || '').trim();
  if (fd.type === 'numstate') { const k = st.match(/pien|met|vuot/i); st = k ? ({pien:'pieno', met:'metà', vuot:'vuoto'})[k[0].toLowerCase()] : ''; }
  return { n: m[1] || '', s: st };
}
function parse(text){
  const f = JSON.parse(JSON.stringify(DEFAULT)); f.xsic = []; f.xamb = [];
  let lines = clean(text).split('\n');
  const h = lines.findIndex(l => /report\s+turno/i.test(l));
  if (h >= 0) lines = lines.slice(h + 1);           // tutto quello prima del titolo (saluti ecc.) si ignora
  let sec = 'intro', planSet = false;
  const rit = [], noteq = [], segn = [];
  const conf = s => /non\s+conform/i.test(s) ? 'n' : 'c';
  for (const raw of lines) {
    const l = raw.trim();
    const m = l.match(SECT);
    if (m) { sec = m[1].toLowerCase().replace(/\s+/g,' ').replace('qualita','qualità'); continue; }
    if (!l) continue;
    const s = l.replace(BUL,'');
    if (sec === 'intro') {
      let x;
      if ((x = s.match(/^\*?produzione\s*:?\s*([\d.,]+)/i))) f.prod = x[1];
      else if ((x = s.match(/^copertura\s+schede\s*:?\s*(.*)$/i))) { const t = x[1].match(/(\d{1,2})\s*[.:,]\s*(\d{2})|(\d{1,2})(?!\d)/); f.copertura = t ? (t[1] ? `${p2(t[1])}:${t[2]}` : `${p2(t[3])}:00`) : ''; }
      else if ((x = s.match(/taglio\s+bramme\s*:?\s*(\d+)/i))) f.taglio = x[1];
      else if (/taglio\s+bramme/i.test(s)) f.taglio = '';
      else if (!SALUTO.test(s)) rit.push(s);
    } else if (sec === 'controllo magazzino' || sec === 'reparto taglio bramme') {
      const g = sec === 'controllo magazzino' ? 'Controllo magazzino' : 'Reparto taglio bramme';
      const fd = FIELDS.find(x => x.g === g && x.re && x.re.test(s));
      if (fd) f[fd.id] = readVal(fd, s.includes(':') ? s.slice(s.indexOf(':') + 1) : s.replace(fd.re, ''));
    } else if (sec === 'sicurezza') {
      if (/dpi/i.test(s)) f.dpi = s;
      else if (/^pulizia/i.test(s)) f.pulizia = s.replace(/^pulizia\s*:?\s*/i,'');
      else if (/violenza/i.test(s)) f.violenza = s;
      else if (/near\s*miss/i.test(s)) f.nearmiss = s;
      else f.xsic.push(s);          // voce non riconosciuta: si ricopia com'è
    } else if (sec === 'qualità') {
      if (/^estetica/i.test(s)) f.estetica = conf(s);
      else if (/^planarit[aà]\s+(non\s+)?conform[ei]\.?$/i.test(s)) { f.planarita = conf(s); planSet = true; }
      else if (/^planarit/i.test(s) && !planSet) {
        // formato vecchio "planarità sul 25 mm accettabile": campo conforme + frase nelle note
        f.planarita = conf(s); planSet = true;
        noteq.push(s.charAt(0).toUpperCase() + s.slice(1));
      }
      else if (/^(larghezz|lunghezz|spessor)/i.test(s)) f.dimensioni = conf(s);
      else noteq.push(s);
    } else if (sec === 'ambiente') {
      if (/^scrubber/i.test(s)) f.scrubber = s.replace(/^scrubber\s*/i,'');
      else if (/convogliate/i.test(s)) f.convog = s.replace(/^.*?convogliate\s*:?\s*/i,'');
      else if (/diffuse/i.test(s)) f.diffuse = s.includes(':') ? s.slice(s.lastIndexOf(':')+1).trim() : s.replace(/^.*?diffuse\s*(\([^)]*\))?\s*/i,'');
      else f.xamb.push(s);
    } else if (sec === 'segnalazioni') segn.push(l);
  }
  f.ritardi = rit.join('\n'); f.noteq = noteq.join('\n'); f.segn = segn.join('\n');
  return f;
}

function autoShift(now){
  const h = now.getHours(), d = new Date(now);

  else if (h >= 18 || h < 2) { s = 1; if (h < 2) d.setDate(d.getDate()-1); }  // intorno alle 22 → 14-22

}

function build(){

          const rest = s.replace(/^\s*\d*\s*cass(?:oni|one)\s*/i, '').replace(/^(risaliti|montalbetti|nostro)\s*/i, '');
          const k = rest.match(/^((?:(?:pien|met|vuot)\w*\s*,?\s*)+)(.*)$/i);
          f[id] = k ? { n, s:(k[1].match(/pien\w*|met\w*|vuot\w*/gi) || []).map(normSt), note:k[2].trim() } : { n, s:[], note:rest.trim() };
        }
        else if ((x = s.match(/^(\d+)\s+bat\b/i))) f.bat = x[1];
        else f.xm.push(s);
      } else if (sec === 'scoria') {
        const lab = s.match(/^(mag\.?\s*lamiere|taglio\s+bramme)\s*:?\s*(.*)$/i);
        let target, rest;
        if (lab) { target = /mag/i.test(lab[1]) ? 'scM' : 'scB'; rest = lab[2]; pend = rest ? null : target; }
        else if (pend) { target = pend; rest = s; pend = null; }
        else { f.xs.push(s); continue; }
        if (!rest) continue;
        { const n = (rest.match(/^\s*(\d+)/) || [])[1] || '';
          const r2 = rest.replace(/^\s*\d*\s*cass(?:oni|one)\s*/i, '');
          const k = r2.match(/^((?:(?:pien|met|vuot)\w*\s*,?\s*)+)(.*)$/i);
          f[target] = k ? { n, s:(k[1].match(/pien\w*|met\w*|vuot\w*/gi) || []).map(normSt), note:k[2].trim() } : { n, s:[], note:r2.trim() }; }
      } else {
        const q = /^superficie\s+inferiore/i.test(s) ? 'q2' : /^superficie/i.test(s) ? 'q1' : /tagli/i.test(s) ? 'q3' : /cilindri/i.test(s) ? 'q4' : /spianatrice/i.test(s) ? 'q5' : null;
        if (q) { f[q] = s; found.add(q); } else f.xq.push(s);
      }
    }
    f.found = found;
    return f;
  }

  function v(id){
    const o = orig[id], f = BY[id];
    if (!checked.has(id)) return o;
    const x = values[id]; if (x === undefined) return o;
    if (f.type === 'num' || f.type === 'line') return String(x).trim() || o;
    return x;
  }
  const cassWord = n => n === '1' ? 'cassone' : 'cassoni';
  function rowOf(f, x){
    if (f.type === 'num') return x ? f.fmt(x) : '';
    if (f.type === 'line') return (x || '').trim();
    if (f.type === 'cass') { const n = (x.n || '').trim(), sts = Array.from({length:Math.min(20, +n || 1)}, (_, i) => (x.s || [])[i]).filter(Boolean), note = (x.note || '').trim();
      if (!(n || sts.length || note)) return ''; const k = n || '1';
      return `${f.lab ? f.name + ': ' : ''}${k} ${cassWord(k)}${f.tipo ? ' ' + f.tipo : ''}${sts.length ? ' ' + sts.join(', ') : ''}${note ? ' ' + note : ''}`; }
    return '';
  }
  const row = id => on(id) ? rowOf(BY[id], v(id)) : '';
  function build(){
    const L = [SALUTO_MG, TITOLO_MG];
    const sez = (title, rows) => { rows = rows.filter(Boolean); if (rows.length) L.push('', ...(title ? [title] : []), ...rows.map(r => '• ' + r)); };
    sez('', ['tot','sped','intest'].map(row));
    sez('', [...['risaliti','montalbetti','nostro','bat'].map(row), ...(orig.xm || [])]);
    sez('*Scoria*', [...['scM','scB'].map(row), ...(orig.xs || [])]);
    sez('*Controllo qualità pacchi*', [...['q1','q2','q3','q4','q5'].map(row), ...(orig.xq || [])]);
    return L.join('\n');
  }

  function show(f, x){
    if (f.type === 'num' || f.type === 'line') return x || '—';
    const r = rowOf(f, x);
    return r.replace(/^[^:]+:\s*/, '') || '—';
  }
  function render(){
    const box = $('mg-groups'); box.innerHTML = '';
    let grp = null, ul = null;
    F.forEach(f => {
      if (f.g !== grp) { grp = f.g; const g = el('div','group'); g.append(el('h3', null, grp)); ul = el('ul'); g.append(ul); box.append(g); }
      const li = el('li');
      const top = el('div','frow');
      const cb = el('input','cb'); cb.type = 'checkbox'; cb.id = 'mg-ck-' + f.id; cb.checked = !excluded.has(f.id);
      const t = el('span','t'); const lb = el('label','name', f.name); lb.htmlFor = cb.id; t.append(lb);
      top.append(cb, t); li.append(top);
      const ed = el('div','ed');
      const paint = () => { const off = excluded.has(f.id); li.classList.toggle('off', off); ed.hidden = off;
        cb.checked = !off; cb.setAttribute('aria-label', f.name + (off ? ': tolto dal messaggio' : ': nel messaggio')); };
      cb.onchange = () => { if (cb.checked) excluded.delete(f.id); else excluded.add(f.id); paint(); update(); };
      const cur = () => values[f.id] || (values[f.id] = { n:'', s:[], note:(orig[f.id] || {}).note || '' });
      let focusEl;
      if (f.type === 'num' || f.type === 'line') {
        focusEl = f.type === 'line' ? el('textarea') : el('input'); focusEl.id = 'mg-in-' + f.id;
        if (f.type === 'line') focusEl.rows = 1; else { focusEl.type = 'text'; focusEl.inputMode = 'numeric'; focusEl.className = 'n'; }
        focusEl.value = values[f.id] || '';
        focusEl.addEventListener('input', () => { values[f.id] = focusEl.value; update(); });
        ed.append(focusEl);
      } else if (f.type === 'cass') {
        const row = el('div','fix'); row.append(el('span','pre','N° cassoni'));
        const n = el('input'); n.type = 'text'; n.inputMode = 'numeric'; n.className = 'n'; n.id = 'mg-in-' + f.id; n.placeholder = 'n°';
        const rows = el('div','cas');
        const nq = () => Math.min(20, +(cur().n || '').trim() || 1);
        const draw = () => {
          rows.innerHTML = '';
          for (let i = 0; i < nq(); i++) {
            const r = el('div','fix'); if (nq() > 1) r.append(el('span','pre', 'Cassone ' + (i + 1)));
            const seg = el('div','seg st');
            const bs = STATES.map(k => { const b = el('button', null, k); b.type = 'button'; b.id = `mg-st-${f.id}-${i}-${k}`;
              b.onclick = () => { cur().s[i] = cur().s[i] === k ? '' : k; paint2(); update(); }; return b; });
            const paint2 = () => bs.forEach((b, j) => b.setAttribute('aria-pressed', cur().s[i] === STATES[j]));
            paint2(); seg.append(...bs); r.append(seg); rows.append(r);
          }
        };
        n.addEventListener('input', () => { cur().n = n.value.replace(/\D/g, ''); draw(); update(); });
        row.append(n);
        const nt = el('input'); nt.type = 'text'; nt.id = 'mg-note-' + f.id; nt.placeholder = 'nota (es. appena cambiato)';
        nt.value = (orig[f.id] || {}).note || ''; nt.addEventListener('input', () => { cur().note = nt.value; update(); });
        draw(); ed.append(row, rows, nt); focusEl = n;
      }
      paint(); li.append(ed); ul.append(li);
    });
  }
  function update(){
    setOut('mg', build());
  }
  function load(text){
    const p = parse(text || ''); orig = p; checked = new Set(F.map(f => f.id)); values = {};
    F.forEach(f => { if (f.type === 'line') values[f.id] = p[f.id]; });
    excluded = new Set(text && text.trim() ? F.filter(f => f.type === 'line' && !p.found.has(f.id)).map(f => f.id) : []);
    render(); update();
  }
  wireCopy('mg-out', 'mg-copy', 'mg-status');
  load('');
  return { update, parse, build };
})();

/* ---------- CONTROLLO LAMIERE ---------- */
const LAM = (() => {
  // Etichette del messaggio: da confermare con Luca (righe testa/coda). Cambiare solo qui.
  const FMT = { titolo:'*Controllo lamiere*', lotto:'Lotto', testa:'Spessori testa:', coda:'Spessori coda:', lung:'Lunghezza:', larg:'Larghezza:' };
  const SIZES = { testa:3, coda:3, lung:2, larg:2 };
  const LABELS = { testa:'Spessori testa', coda:'Spessori coda', lung:'Lunghezze', larg:'Larghezze' };
  const newLot = () => ({ num:'', testa:['','',''], coda:['','',''], lung:['',''], larg:['',''] });
  let lots = [newLot()];

  function parse(text){
    const out = []; let cur = null, key = null;
    for (const raw of clean(text).split('\n')) {
      const l = raw.trim().replace(BUL, '').replace(/\*/g, '').trim(); if (!l) continue;
      let m;
      if ((m = l.match(/^lotto\s*:?\s*(\S*)/i))) { cur = newLot(); cur.num = m[1]; out.push(cur); key = null; continue; }
      if (!cur) continue;
      const lab = /testa/i.test(l) ? 'testa' : /coda/i.test(l) ? 'coda' : /lunghezz/i.test(l) ? 'lung' : /larghezz/i.test(l) ? 'larg' : null;
      let nums;
      if (lab) { key = lab; const rest = l.includes(':') ? l.slice(l.indexOf(':') + 1) : l.replace(/^[^\d]*/, ''); nums = rest.match(/\d+(?:[.,]\d+)?/g) || []; }
      else if (key && /^[\d\s.,\-–]+$/.test(l)) nums = l.match(/\d+(?:[.,]\d+)?/g) || [];
      else continue;
      cur[key] = Array.from({ length:SIZES[key] }, (_, i) => nums[i] || '');
    }
    return out;
  }
  function build(){
    const blocks = lots.map(L => {
      const r = []; if (L.num.trim()) r.push(`${FMT.lotto} ${L.num.trim()}`);
      for (const k of Object.keys(SIZES)) { const vals = L[k].map(x => x.trim()).filter(Boolean); if (vals.length) r.push(`${FMT[k]} ${vals.join(' ')}`); }
      return r;
    }).filter(r => r.length);
    if (!blocks.length) return '';
    return [FMT.titolo, ...blocks.flatMap((b, i) => i ? ['', ...b] : b)].join('\n');
  }
  function update(){ setOut('la', build()); }

  function inp(arr, i, id){ const e = el('input'); e.type = 'text'; e.inputMode = 'decimal'; e.id = id; e.value = arr[i];
    e.addEventListener('input', () => { arr[i] = e.value; update(); }); return e; }
  function render(){
    const box = $('la-lots'); box.innerHTML = '';
    lots.forEach((L, n) => {
      const g = el('div','group');
      const bar = el('div','lotbar'); bar.append(el('h3', null, 'Lotto ' + (n + 1)));
      if (lots.length > 1) { const rm = el('button', null, 'Togli'); rm.type = 'button'; rm.id = 'la-rm-' + n;
        rm.onclick = () => { lots.splice(n, 1); render(); update(); }; bar.append(rm); }
      g.append(bar);
      const r0 = el('div','fix'); r0.append(el('span','pre','Numero lotto'));
      const nb = el('input'); nb.type = 'text'; nb.inputMode = 'numeric'; nb.id = `la-num-${n}`; nb.value = L.num;
      nb.addEventListener('input', () => { L.num = nb.value; update(); }); r0.append(nb); g.append(r0);
      for (const k of Object.keys(SIZES)) {
        const r = el('div','fix multi'); r.append(el('span','pre', LABELS[k]));
        for (let i = 0; i < SIZES[k]; i++) r.append(inp(L[k], i, `la-${k}-${n}-${i}`));
        g.append(r);
      }
      box.append(g);
    });
  }
  function load(text){
    const p = parse(text);
    lots = p.length ? p : [newLot()];
    render(); update();
  }
  $('la-add').onclick = () => { lots.push(newLot()); render(); update(); $(`la-num-${lots.length - 1}`).focus(); };
  wireCopy('la-out', 'la-copy', 'la-status');
  render(); update();
  return { update, parse, build };
})();
