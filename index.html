<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report Turno FIL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna da telefono, pulita: intestazione → incolla → turno → Modifiche da fare → messaggio pronto */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#1b242b; --muted:#5d6b75; --line:#d3dade;
  --steel:#2f4a5c; --accent:#d9861c; --accent-ink:#1b242b; --ok:#2e7d4f; --bad:#b3372b; --soft:#f5f7f8;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181c; --panel:#1b2329; --ink:#e4e9ec; --muted:#95a3ac; --line:#2e3a42;
  --steel:#8fb3c9; --accent:#f0a340; --accent-ink:#12181c; --ok:#5cc28a; --bad:#ef7a6c; --soft:#161d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --panel:#1b2329; --ink:#e4e9ec; --muted:#95a3ac; --line:#2e3a42;
  --steel:#8fb3c9; --accent:#f0a340; --accent-ink:#12181c; --ok:#5cc28a; --bad:#ef7a6c; --soft:#161d22; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:8px;background:var(--steel);color:var(--panel);display:grid;place-items:center;font:700 16px/1 var(--f-display);letter-spacing:.5px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
header .brand{display:flex;flex-direction:column;line-height:1.05}
header .brand b{font:700 13px/1 var(--f-display);letter-spacing:2px;color:var(--muted)}
header h1{font:700 24px/1.1 var(--f-display);margin:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
h2{margin:0;font:700 13px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:1.2px;color:var(--steel)}
textarea,input{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.45}
#src{min-height:110px;font-size:13.5px}
textarea:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:600 15px/1.1 var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.shiftRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shiftRow button{font-family:var(--f-mono);font-weight:500;padding:11px 2px}
.shiftRow button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--panel)}
.shiftRow input{grid-column:1/-1;font-family:var(--f-mono);min-width:0}

#toggle{width:100%;font-size:17px;padding:16px}
#toggle .cnt{font:500 12px/1 var(--f-mono);background:var(--accent-ink);color:var(--accent);border-radius:10px;padding:3px 7px}
.group h3{margin:8px 0 0;font:700 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.group ul{list-style:none;margin:0;padding:0}
.group li{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.ck{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ck input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;padding:0;accent-color:var(--accent)}
.ck .t{display:flex;flex-direction:column;min-width:0}
.ck .name{font-weight:600}
.ck .cur{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck .cur.bad{color:var(--bad)}
.ed{padding-left:34px;display:flex;flex-direction:column;gap:6px}
.fix{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fix .pre,.fix .suf{font-size:14px;color:var(--muted)}
.fix input{flex:1 1 120px;min-width:0}
.fix input.n{flex:0 1 110px;font-family:var(--f-mono);font-size:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:11px 6px}
.seg button.c[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.seg button.n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--panel)}

#out{min-height:240px;font-size:13.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar>*{flex:1 1 150px}
.status{font-size:13px;color:var(--ok);margin:0}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:active{filter:brightness(.92)}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo" id="logo" aria-label="FIL">FIL</div>
    <div class="brand"><b>FIL</b><h1>Report turno</h1></div>
  </header>

  <section class="card">
    <textarea id="src" spellcheck="false" aria-label="Report precedente" placeholder="Incolla il report precedente"></textarea>
  </section>

  <section class="card">
    <div class="shiftRow" id="shiftRow">
      <button type="button" data-i="0">6-14</button>
      <button type="button" data-i="1">14-22</button>
      <button type="button" data-i="2">22-6</button>
      <input type="date" id="date" aria-label="Data">
    </div>
  </section>

  <section class="card">
    <button class="primary" id="toggle" type="button" aria-expanded="false">Modifiche da fare <span class="cnt" id="cnt" hidden></span></button>
    <div id="panel" hidden><div id="groups"></div></div>
  </section>

  <section class="card">
    <h2>Messaggio pronto</h2>
    <textarea id="out" readonly aria-label="Messaggio pronto"></textarea>
    <div class="bar">
      <button class="primary" id="copy" type="button">Copia</button>
      <a class="btn" id="wa" href="#" target="_blank" rel="noopener">Apri in WhatsApp</a>
    </div>
    <p class="status" id="status" role="status" hidden></p>
  </section>
</div>

<script>
/* ---------- i campi (le "celle") ---------- */
// pre/suf = testo fisso intorno al box; opt = se lo lasci vuoto la riga sparisce
const DIFF_PRE = 'Emissioni diffuse (discagliatore, spianatrice, taglio lamiere e treno di laminazione):';
const FIELDS = [
  { g:'Produzione', id:'prod',      name:'Produzione',            type:'num',  pre:'Produzione', suf:'ton' },
  { g:'Produzione', id:'ritardi',   name:'Ritardi',               type:'text', opt:true },
  { g:'Produzione', id:'copertura', name:'Copertura schede',      type:'line', pre:'Copertura schede', opt:true },
  { g:'Produzione', id:'taglio',    name:'Reparto taglio bramme', type:'num',  pre:'Reparto taglio bramme:' },
  { g:'Sicurezza',  id:'dpi',       name:'DPI e procedure',       type:'line' },
  { g:'Sicurezza',  id:'pulizia',   name:'Pulizia',               type:'line', pre:'Pulizia:' },
  { g:'Sicurezza',  id:'violenza',  name:'Violenza',              type:'line' },
  { g:'Sicurezza',  id:'nearmiss',  name:'Near miss',             type:'line' },
  { g:'Qualità',    id:'estetica',  name:'Estetica',              type:'conf' },
  { g:'Qualità',    id:'planarita', name:'Planarità',             type:'conf' },
  { g:'Qualità',    id:'dimensioni',name:'Larghezze, lunghezze e spessori', type:'conf', plural:true },
  { g:'Qualità',    id:'noteq',     name:'Note qualità',          type:'text', opt:true },
  { g:'Ambiente',   id:'scrubber',  name:'Scrubber',              type:'line', pre:'Scrubber' },
  { g:'Ambiente',   id:'convog',    name:'Emissioni convogliate', type:'line', pre:'Emissioni convogliate' },
  { g:'Ambiente',   id:'diffuse',   name:'Emissioni diffuse',     type:'line', pre:DIFF_PRE },
  { g:'Segnalazioni', id:'segn',    name:'Segnalazioni',          type:'text', opt:true },
];
const BYID = Object.fromEntries(FIELDS.map(f => [f.id, f]));
const DEFAULT = {
  prod:'', ritardi:'', copertura:'', taglio:'',
  dpi:'Tutti i dipendenti hanno indossato correttamente i DPI e rispettato le procedure di sicurezza.',
  pulizia:'nessuna segnalazione.', violenza:'Nessun atto di violenza nè fisica nè verbale.', nearmiss:'Nessun near miss.',
  estetica:'c', planarita:'c', dimensioni:'c', noteq:'',
  scrubber:'in marcia.', convog:'nella norma', diffuse:'nella norma', segn:''
};

const $ = id => document.getElementById(id);
let orig = {};            // campi letti dal report di prima
let checked = new Set();  // campi spuntati
let values = {};          // valori scritti nei box

/* ---------- lettura del report ---------- */
const BUL = /^\s*[•\-*·]\s*/;
const SALUTO = /^(buon(giorno|asera|a\s+\w+|\s+\w+)|ciao|salve|ecco)\b[^\n]{0,40}$/i;
const SECT = /^\s*\*?\s*(sicurezza|qualit[aà]|ambiente|segnalazioni)\s*\*?\s*:?\s*$/i;
function clean(t){
  return t.replace(/\r\n?/g,'\n').replace(/[‎‏‪-‮]/g,'')
    .replace(/^\s*\[\d{1,2}\/\d{1,2}(?:\/\d{2,4})?,?\s+\d{1,2}[:.]\d{2}\]\s*[^:\n]+:\s*/gm,'');
}
function parse(text){
  const f = { ...DEFAULT };
  let lines = clean(text).split('\n');
  const h = lines.findIndex(l => /report\s+turno/i.test(l));
  if (h >= 0) lines = lines.slice(h + 1);           // tutto quello prima del titolo (saluti ecc.) si ignora
  let sec = 'intro', planSet = false;
  const rit = [], noteq = [], segn = [];
  const conf = s => /non\s+conform/i.test(s) ? 'n' : 'c';
  for (const raw of lines) {
    const l = raw.trim();
    const m = l.match(SECT);
    if (m) { sec = m[1].toLowerCase().replace('qualita','qualità'); continue; }
    if (!l) continue;
    const s = l.replace(BUL,'');
    if (sec === 'intro') {
      let x;
      if ((x = s.match(/^\*?produzione\s*:?\s*([\d.,]+)/i))) f.prod = x[1];
      else if ((x = s.match(/^copertura\s+schede\s*:?\s*(.*)$/i))) f.copertura = x[1];
      else if ((x = s.match(/taglio\s+bramme\s*:?\s*(\d+)/i))) f.taglio = x[1];
      else if (/taglio\s+bramme/i.test(s)) f.taglio = '';
      else if (!SALUTO.test(s)) rit.push(s);
    } else if (sec === 'sicurezza') {
      if (/dpi/i.test(s)) f.dpi = s;
      else if (/^pulizia/i.test(s)) f.pulizia = s.replace(/^pulizia\s*:?\s*/i,'');
      else if (/violenza/i.test(s)) f.violenza = s;
      else if (/near\s*miss/i.test(s)) f.nearmiss = s;
    } else if (sec === 'qualità') {
      if (/^estetica/i.test(s)) f.estetica = conf(s);
      else if (/^planarit[aà]\s+(non\s+)?conform[ei]\.?$/i.test(s)) { f.planarita = conf(s); planSet = true; }
      else if (/^planarit/i.test(s) && !planSet) {
        // formato vecchio "planarità sul 25 mm accettabile": campo conforme + frase nelle note
        f.planarita = conf(s); planSet = true;
        noteq.push(s.charAt(0).toUpperCase() + s.slice(1));
      }
      else if (/^(larghezz|lunghezz|spessor)/i.test(s)) f.dimensioni = conf(s);
      else noteq.push(s);
    } else if (sec === 'ambiente') {
      if (/^scrubber/i.test(s)) f.scrubber = s.replace(/^scrubber\s*/i,'');
      else if (/convogliate/i.test(s)) f.convog = s.replace(/^.*?convogliate\s*:?\s*/i,'');
      else if (/diffuse/i.test(s)) f.diffuse = s.includes(':') ? s.slice(s.lastIndexOf(':')+1).trim() : s.replace(/^.*?diffuse\s*(\([^)]*\))?\s*/i,'');
    } else if (sec === 'segnalazioni') segn.push(l);
  }
  f.ritardi = rit.join('\n'); f.noteq = noteq.join('\n'); f.segn = segn.join('\n');
  return f;
}

/* ---------- turno e data dall'ora del telefono ---------- */
const SHIFTS = ['6-14','14-22','22-6'];
function autoShift(now){
  const h = now.getHours(), d = new Date(now);
  let s;
  if (h >= 10 && h < 18) s = 0;                                               // intorno alle 14 → 6-14
  else if (h >= 18 || h < 2) { s = 1; if (h < 2) d.setDate(d.getDate()-1); }  // intorno alle 22 → 14-22
  else s = 2;                                                                 // intorno alle 6 → 22-6, data della mattina
  return { s, d };
}
const p2 = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
let shift = 0, manual = false;
function paintShift(){ document.querySelectorAll('#shiftRow button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === shift)); }
document.querySelectorAll('#shiftRow button').forEach(b => b.onclick = () => { shift = +b.dataset.i; manual = true; paintShift(); update(); });
function setNow(){ const a = autoShift(new Date()); shift = a.s; $('date').value = isoDate(a.d); paintShift(); }

/* ---------- messaggio nuovo ---------- */
function v(id){
  if (!checked.has(id)) return orig[id] || '';
  const x = values[id] || '';
  if (BYID[id].type === 'conf') return x || orig[id];
  return x.trim() ? x : (BYID[id].opt ? '' : orig[id] || '');
}
const confTxt = (x, plural) => (x === 'n' ? 'non ' : '') + (plural ? 'conformi' : 'conforme');
const lines = s => (s || '').split('\n').map(x => x.trim()).filter(Boolean);
function build(){
  const [, m, d] = ($('date').value || isoDate(new Date())).split('-');
  const L = [`*Report turno ${SHIFTS[shift]} del ${d}/${m}*`];
  if (v('prod')) L.push(`Produzione ${v('prod').trim()} ton`);
  L.push(...lines(v('ritardi')));
  if (v('copertura').trim()) L.push(`Copertura schede ${v('copertura').trim()}`);
  L.push('', `Reparto taglio bramme: ${v('taglio').trim() || '0'}`);
  L.push('', 'Sicurezza');
  L.push('• ' + v('dpi').trim(), '• Pulizia: ' + v('pulizia').trim(), '• ' + v('violenza').trim(), '• ' + v('nearmiss').trim());
  L.push('', 'Qualità');
  L.push('• estetica ' + confTxt(v('estetica')));
  L.push('• planarità ' + confTxt(v('planarita')));
  L.push('• larghezze, lunghezze e spessori ' + confTxt(v('dimensioni'), true));
  lines(v('noteq')).forEach(x => L.push('• ' + x.replace(BUL,'')));
  L.push('', 'Ambiente');
  L.push('Scrubber ' + v('scrubber').trim());
  L.push('Emissioni convogliate ' + v('convog').trim());
  L.push(DIFF_PRE + ' ' + v('diffuse').trim());
  L.push('', 'Segnalazioni:', v('segn').trim() || 'Nessuna');
  return L.join('\n');
}

/* ---------- interfaccia ---------- */
function show(f, x){
  if (f.type === 'conf') return confTxt(x, f.plural);
  if (f.id === 'prod') return x ? x + ' ton' : '—';
  const l = lines(x)[0];
  return l || '—';
}
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function renderFields(){
  const box = $('groups'); box.innerHTML = '';
  let grp = null, ul = null;
  FIELDS.forEach(f => {
    if (f.g !== grp) {
      grp = f.g;
      const g = el('div','group'); g.append(el('h3', null, grp)); ul = el('ul'); g.append(ul); box.append(g);
    }
    const li = el('li');
    const lab = el('label','ck');
    const cb = el('input'); cb.type = 'checkbox'; cb.id = 'ck-' + f.id; cb.checked = checked.has(f.id);
    const t = el('span','t'); t.append(el('span','name', f.name));
    const cur = el('span','cur', show(f, orig[f.id])); if (f.type === 'conf' && orig[f.id] === 'n') cur.classList.add('bad');
    t.append(cur); lab.append(cb, t); li.append(lab);

    const ed = el('div','ed'); ed.hidden = !cb.checked;
    let focusEl;
    if (f.type === 'conf') {
      const seg = el('div','seg');
      const bc = el('button','c', confTxt('c', f.plural)), bn = el('button','n', confTxt('n', f.plural));
      bc.type = bn.type = 'button';
      const paint = () => { const x = values[f.id] || orig[f.id]; bc.setAttribute('aria-pressed', x === 'c'); bn.setAttribute('aria-pressed', x === 'n'); };
      bc.onclick = () => { values[f.id] = 'c'; paint(); update(); };
      bn.onclick = () => { values[f.id] = 'n'; paint(); update(); };
      paint(); seg.append(bc, bn); ed.append(seg); focusEl = bc;
    } else {
      focusEl = f.type === 'text' ? el('textarea') : el('input');
      focusEl.id = 'in-' + f.id;
      if (f.type === 'text') focusEl.rows = 3;
      else { focusEl.type = 'text'; if (f.type === 'num') { focusEl.inputMode = 'decimal'; focusEl.className = 'n'; } }
      focusEl.value = values[f.id] || '';
      focusEl.addEventListener('input', () => { values[f.id] = focusEl.value; update(); });
      if (f.pre || f.suf) {
        const row = el('div','fix');
        if (f.pre) row.append(el('span','pre', f.pre));
        row.append(focusEl);
        if (f.suf) row.append(el('span','suf', f.suf));
        ed.append(row);
      } else ed.append(focusEl);
    }
    cb.addEventListener('change', () => {
      if (cb.checked) checked.add(f.id); else checked.delete(f.id);
      ed.hidden = !cb.checked; update();
      if (cb.checked) focusEl.focus();
    });
    li.append(ed); ul.append(li);
  });
}
function fit(e){ e.style.height = 'auto'; e.style.height = Math.max(240, e.scrollHeight + 4) + 'px'; }
function update(){
  const has = $('src').value.trim() !== '';
  const text = has ? build() : '';
  $('out').value = text; fit($('out'));
  $('wa').href = 'https://wa.me/?text=' + encodeURIComponent(text);
  $('status').hidden = true;
  const n = checked.size;
  $('cnt').hidden = !n; $('cnt').textContent = n;
}
function load(text){
  orig = parse(text || ''); checked = new Set(); values = {}; manual = false;
  setNow(); renderFields(); update();
}

$('src').addEventListener('input', () => load($('src').value));
$('date').addEventListener('change', () => { manual = true; update(); });
$('toggle').onclick = () => {
  const open = $('panel').hidden;
  $('panel').hidden = !open; $('toggle').setAttribute('aria-expanded', open);
};
$('copy').onclick = () => {
  const text = $('out').value; if (!text) return;
  const say = m => { $('status').textContent = m; $('status').hidden = false; };
  const fallback = () => { const o = $('out'); o.focus(); o.select(); try { document.execCommand('copy') ? say('Copiato') : say('Tieni premuto e scegli Copia'); } catch(e) { say('Tieni premuto e scegli Copia'); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => say('Copiato'), fallback); else fallback();
};
// se l'app resta aperta, turno e data si riallineano all'ora quando torni sull'app (se non hai ancora spuntato niente)
document.addEventListener('visibilitychange', () => { if (!document.hidden && !manual) { setNow(); update(); } });

load('');
</script>
</body>
</html>
